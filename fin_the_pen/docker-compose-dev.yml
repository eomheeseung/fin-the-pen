#        - finthepen-dev-network
#    command: ["sh", "-c", "yarn install && yarn dev --host 0.0.0.0"]

networks:
  finthepen-dev-network:
    driver: bridge

volumes:
  mysql-dev-volume:
    driver: local
  finthepen-dev-volume:
    driver: local
