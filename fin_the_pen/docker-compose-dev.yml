version: "3"

services:
  finthepen-dev-db:
    container_name: finthepen-dev-db
    image: mysql:8.0.34
    restart: no
    volumes:
      - mysql-dev-volume:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Finthepen
      - MYSQL_DATABASE=fin_the_pen
    ports:
      - "3307:3306"
    networks:
      - finthepen-dev-network

  finthepen-dev-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finthepen-dev-server
    restart: no
    volumes:
      - finthepen-dev-volume:/var/log
    ports:
      - "8082:8080"
    networks:
      - finthepen-dev-network
    depends_on:
      - finthepen-dev-db

